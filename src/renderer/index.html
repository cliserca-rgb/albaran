<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; frame-src file:; style-src 'self'">
  <title>Albaranes</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="barra">
    <h1>Albaranes</h1>
    <input id="busqueda" type="search" placeholder="Buscar por número, empresa, notas…">
    <select id="filtro-estado">
      <option value="">Todos los estados</option>
      <option value="pendiente">Pendiente</option>
      <option value="revisado">Revisado</option>
      <option value="facturado">Facturado</option>
    </select>
    <button id="btn-subir" class="primario">Subir PDF</button>
    <button id="btn-copia">Copia de seguridad</button>
    <button id="btn-carpeta">Carpeta de datos</button>
  </header>

  <main>
    <aside class="lista">
      <div id="contador" class="contador"></div>
      <ul id="lista"></ul>
      <div id="vacio" class="vacio" hidden>
        <p>Todavía no hay albaranes.</p>
        <p>Pulsa <strong>Subir PDF</strong> o arrastra los archivos aquí.</p>
      </div>
    </aside>

    <section id="detalle" class="detalle" hidden>
      <iframe id="visor" title="Albarán"></iframe>
      <form id="formulario" class="formulario">
        <label>Número <input name="numero"></label>
        <label>Fecha <input name="fecha" type="date"></label>
        <label>Empresa (proveedor / cliente) <input name="empresa"></label>
        <label>Importe (€) <input name="importe" type="number" step="0.01"></label>
        <label>Estado
          <select name="estado">
            <option value="pendiente">Pendiente</option>
            <option value="revisado">Revisado</option>
            <option value="facturado">Facturado</option>
          </select>
        </label>
        <label>Notas <textarea name="notas" rows="4"></textarea></label>
        <p id="archivo-info" class="info"></p>
        <div class="acciones">
          <button type="submit" class="primario">Guardar</button>
          <button type="button" id="btn-externo">Abrir PDF</button>
          <button type="button" id="btn-eliminar" class="peligro">Eliminar</button>
        </div>
        <p id="estado-guardado" class="info"></p>
      </form>
    </section>
    <section id="sin-seleccion" class="sin-seleccion">Selecciona un albarán de la lista</section>
  </main>

  <div id="soltar" class="soltar" hidden>Suelta los PDF para subirlos</div>
  <script src="app.js"></script>
</body>
</html>
