name: Instalador Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: npm run dist
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          set -o pipefail
          if ! npm run dist 2>&1 | tee build.log; then
            # Publica el final del registro como anotación para poder leerlo desde la API
            tail -n 40 build.log | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}' | sed 's/^/::error title=Fallo al compilar::/'
            echo
            exit 1
          fi
      - name: Autoprueba de la app empaquetada
        shell: bash
        run: |
          estado=0
          timeout 300 ./dist/win-unpacked/Albaranes.exe --autoprueba test/ejemplos/ejemplo.pdf informe.txt || estado=$?
          informe=$(cat informe.txt 2>/dev/null || echo "sin informe (codigo $estado)")
          echo "$informe"
          resumen=$(echo "$informe" | head -c 3000 | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')
          if [ "$estado" != 0 ]; then echo "::error title=Fallo en la autoprueba::$resumen"; exit 1; fi
          echo "::notice title=Autoprueba correcta::$resumen"
      - uses: actions/upload-artifact@v4
        with:
          name: Albaranes-instalador
          path: dist/*.exe
          if-no-files-found: error
