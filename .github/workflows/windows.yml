name: Instalador Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write # para publicar el instalador en "Releases"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: npm run dist
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          set -o pipefail
          if ! npm run dist 2>&1 | tee build.log; then
            # Publica el final del registro como anotación para poder leerlo desde la API
            tail -n 40 build.log | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}' | sed 's/^/::error title=Fallo al compilar::/'
            echo
            exit 1
          fi
      - name: Autoprueba de la app empaquetada
        shell: bash
        run: |
          fallos=0
          for ejemplo in ejemplo.pdf ejemplo.jpg; do
            estado=0
            timeout 180 ./dist/win-unpacked/Albaranes.exe --autoprueba "test/ejemplos/$ejemplo" informe.txt || estado=$?
            informe=$(cat informe.txt 2>/dev/null || echo "sin informe (codigo $estado)")
            echo "$informe"
            resumen=$(echo "$informe" | tail -c 3000 | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')
            if [ "$estado" != 0 ]; then echo "::error title=Fallo en la autoprueba ($ejemplo)::$resumen"; fallos=1;
            else echo "::notice title=Autoprueba correcta ($ejemplo)::$(tail -n 1 informe.txt)"; fi
          done
          exit $fallos
      - name: Autoprueba del escáner (sin escáner conectado)
        shell: bash
        run: |
          estado=0
          timeout 60 ./dist/win-unpacked/Albaranes.exe --autoprueba-escaner escaner.txt || estado=$?
          informe=$(cat escaner.txt 2>/dev/null || echo "sin informe (codigo $estado)")
          if [ "$estado" != 0 ]; then echo "::error title=Fallo en la autoprueba del escáner::$informe"; exit 1; fi
          echo "::notice title=Autoprueba del escáner::$informe"
      - uses: actions/upload-artifact@v4
        with:
          name: Albaranes-instalador
          path: dist/*.exe
          if-no-files-found: error
      # Publica el instalador en la página de descargas: https://github.com/<repo>/releases/latest
      - name: Publicar en Releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          etiqueta="v$version"
          if gh release view "$etiqueta" > /dev/null 2>&1; then
            gh release upload "$etiqueta" dist/*.exe --clobber
          else
            gh release create "$etiqueta" dist/*.exe --title "Albaranes $version" --notes "Descarga el archivo .exe de abajo y ábrelo para instalar." --latest
          fi
